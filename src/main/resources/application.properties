# =============================================================================
# Carga del archivo .env (variables de entorno locales)
# =============================================================================
# Spring Boot NO lee .env de forma nativa; se importa aquí como "properties".
# El bloque [.] al final es REQUIRED: le dice a Spring que USE el separador de
# puntos en los nombres de variable (si no, toma "DB_URL" como "db.url").
# `optional:` evita que la app falle si el archivo no existe (CI, producción).
#
# Los valores del .env tienen PRIORIDAD sobre los de este archivo, asi que
# permiten sobreescribir los valores por defecto (p. ej. apuntar a Neon).
spring.config.import=optional:file:.env[.properties]

spring.application.name=beautyManagerApi

# =============================================================================
# Puerto HTTP
# =============================================================================
# Render (y la mayoria de PaaS) inyectan el puerto asignado en la variable de
# entorno PORT, que no siempre es 8080. Si la app escucha en otro puerto, la
# plataforma no la encuentra. El default 8080 mantiene el comportamiento local.
server.port=${PORT:8080}

# =============================================================================
# Base de datos (PostgreSQL)
# =============================================================================
# Sin perfil activo (por defecto) -> NEON (variables DB_*).
# Con perfil "local"                -> PostgreSQL local (variables LOCAL_DB_*).
#   Ver src/main/resources/application-local.properties
# Las credenciales NO se escriben en el codigo: se leen del archivo .env
# (ignorado por git) o de variables de entorno del sistema / del IDE.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/beautymanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# =============================================================================
# Autenticación JWT
# =============================================================================
# Secreto para firmar los tokens (HMAC: mínimo 32 bytes / 64 hex).
# ¡Obténlo de variables de entorno / secretos en producción, no lo dejes aquí!
# Sin valor por defecto: en local lo aporta application-local.properties (perfil "local").
app.jwt.secret=${JWT_SECRET}
# Tiempo de validez del token en milisegundos (por defecto 24 horas)
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Purga de tokens revocados (logout): elimina los que ya expiraron.
# Cron por defecto: cada hora en punto. Desactivable con enabled=false.
app.jwt.revoked-token-purge.enabled=${JWT_PURGE_ENABLED:true}
app.jwt.revoked-token-purge.cron=${JWT_PURGE_CRON:0 0 * * * *}