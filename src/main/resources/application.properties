spring.application.name=beautyManagerApi

# =============================================================================
# Base de datos (PostgreSQL)
# =============================================================================
# Las credenciales NO se escriben en el código: se leen de variables de entorno.
#   DB_URL      -> URL JDBC de conexión
#   DB_USERNAME -> usuario de la base de datos
#   DB_PASSWORD -> contraseña de la base de datos
# Los valores por defecto son para desarrollo local (PostgreSQL en localhost).
# Para Neon/producción exporta estas variables (o usa un perfil que las defina).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/beautymanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# =============================================================================
# Autenticación JWT
# =============================================================================
# Secreto para firmar los tokens (HS256 requiere mínimo 32 bytes).
# ¡Obténlo de variables de entorno / secretos en producción, no lo dejes aquí!
# Sin valor por defecto: en local lo aporta application-local.properties (perfil "local").
app.jwt.secret=${JWT_SECRET}
# Tiempo de validez del token en milisegundos (por defecto 24 horas)
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Purga de tokens revocados (logout): elimina los que ya expiraron.
# Cron por defecto: cada hora en punto. Desactivable con enabled=false.
app.jwt.revoked-token-purge.enabled=${JWT_PURGE_ENABLED:true}
app.jwt.revoked-token-purge.cron=${JWT_PURGE_CRON:0 0 * * * *}